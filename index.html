<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Crypto Machine V2</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #121212; color: #fff; }
    .container { display: flex; gap: 20px; }
    .editor { flex: 2; }
    .reference-table { flex: 1; border-left: 2px solid #333; padding-left: 20px; height: 85vh; overflow-y: auto; }
    textarea { width: 100%; height: 80px; font-size: 18px; margin-bottom: 15px; background: #222; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 8px; box-sizing: border-box; }
    
    .key-control { margin-bottom: 20px; background: #2a2a2a; padding: 15px; border-radius: 8px; display: flex; align-items: center; gap: 15px; }
    .key-control input { width: 80px; padding: 8px; font-size: 16px; border-radius: 5px; border: 1px solid #555; background: #1a1a1a; color: #fff; text-align: center; }

    /* PDF yuklash tugmasi */
    .download-btn {
      background: #22c55e;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .download-btn:hover { background: #16a34a; }

    /* Natija oynasi */
    .output-box { 
      border: 1px solid #ccc; 
      padding: 15px; 
      min-height: 100px; 
      background: #ffffff; 
      display: flex; 
      flex-wrap: wrap; 
      gap: 0px; 
      align-items: center; 
      border-radius: 8px;
      line-height: 1;
    }

    /* Katta va bir-biriga yaqin harflar */
    .symbol-img { 
      height: 55px; 
      width: auto;
      object-fit: contain; 
      margin: 0 -6px; 
      filter: contrast(200%);
    }

    /* Probel masofasi */
    .space-box { 
      width: 18px; 
      height: 55px; 
    }

    .ref-item { 
      display: inline-flex; 
      align-items: center; 
      gap: 10px; 
      margin: 4px; 
      border: 1px solid #444; 
      padding: 6px; 
      border-radius: 6px;
      background: #2a2a2a;
    }

    /* PDF UCHUN MAXSUS IXCHAM STIL (FAQT CHOP ETILGANDA ISHLAYDI) */
    @media print {
      body { background: #fff; color: #000; padding: 10px; }
      .download-btn, textarea, h3:nth-of-type(1) { display: none !important; }
      
      .container { display: block; }
      .editor { width: 100%; margin-bottom: 20px; }
      
      /* PDFda alifboni tagga tushirib, 6 ta ustunli kompakt jadval qilamiz */
      .reference-table { 
        width: 100%; 
        height: auto; 
        overflow: visible; 
        border-left: none; 
        border-top: 2px solid #ccc; 
        padding-left: 0; 
        padding-top: 15px; 
      }
      
      #keyTable {
        display: grid !important;
        grid-template-columns: repeat(6, 1fr);
        gap: 6px;
      }

      .key-control { background: #f0f0f0; color: #000; border: 1px solid #ccc; }
      .key-control input { background: #fff; color: #000; border: 1px solid #ccc; }
      .ref-item { background: #f9f9f9; color: #000; border: 1px solid #ccc; justify-content: center; padding: 4px; }
    }
  </style>
</head>
<body>

  <h1>Crypto Machine V2</h1>

  <button class="download-btn" onclick="printPDF()">📄 PDF sifatida saqlash</button>

  <div class="container">
    <div class="editor">
      
      <div class="key-control">
        <label for="shiftKey"><b>Maxfiy Kalit:</b></label>
        <input type="number" id="shiftKey" value="1" min="1" max="25">
      </div>

      <h3>Matn kiriting:</h3>
      <textarea id="inputText" placeholder="Bu yerga yozing..."></textarea>
      
      <h3>Shifrlangan natija:</h3>
      <div id="output" class="output-box"></div>
    </div>

    <div class="reference-table">
      <h3>Shifr Kaliti</h3>
      <div id="keyTable"></div>
    </div>
  </div>

  <script>
    const alphabet = 'abcdefghijklmnopqrstuvwxyz'.split('');

    const input = document.getElementById('inputText');
    const shiftKeyInput = document.getElementById('shiftKey');
    const output = document.getElementById('output');
    const keyTableDiv = document.getElementById('keyTable');

    function getShiftedChar(char, key) {
      const index = alphabet.indexOf(char);
      if (index === -1) return char;
      const newIndex = (index + key) % 26;
      return alphabet[newIndex];
    }

    function updateApp() {
      const key = parseInt(shiftKeyInput.value) || 0;

      keyTableDiv.innerHTML = '';
      alphabet.forEach(char => {
        const shiftedChar = getShiftedChar(char, key);
        keyTableDiv.innerHTML += `
          <div class="ref-item">
            <b>${char.toUpperCase()}</b> → 
            <img src="images/${shiftedChar}.png" class="symbol-img" alt="${shiftedChar}">
          </div>
        `;
      });

      output.innerHTML = '';
      const text = input.value.toLowerCase();

      for (let char of text) {
        if (alphabet.includes(char)) {
          const shiftedChar = getShiftedChar(char, key);
          const img = document.createElement('img');
          img.src = `images/${shiftedChar}.png`;
          img.className = 'symbol-img';
          output.appendChild(img);
        } else if (char === ' ') {
          const space = document.createElement('div');
          space.className = 'space-box';
          output.appendChild(space);
        } else {
          const span = document.createElement('span');
          span.style.fontSize = '24px';
          span.style.color = '#000';
          span.style.fontWeight = 'bold';
          span.innerText = char;
          output.appendChild(span);
        }
      }
    }

    function printPDF() {
      window.print();
    }

    input.addEventListener('input', updateApp);
    shiftKeyInput.addEventListener('input', updateApp);

    updateApp();
  </script>
</body>
</html>
